plugins {
    id 'com.android.application'
}

android {
    namespace 'de.janm.stundennachweis'
    compileSdk 36

    defaultConfig {
        applicationId 'de.janm.stundennachweis'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
